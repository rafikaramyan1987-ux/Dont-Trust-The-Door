name: Build & deploy to GitHub Pages

# Builds the game and publishes dist/ to the `gh-pages` branch, which GitHub Pages serves
# at https://<owner>.github.io/<repo>/ (Settings → Pages → "Deploy from a branch: gh-pages").
# A playtest build in gh-pages:preview/ (https://<owner>.github.io/<repo>/preview/) is carried over.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run test:levels
      - run: npm run build
      - name: Publish dist/ to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # keep the playtest preview (gh-pages:preview/) when the live game is redeployed
          if git fetch -q --depth=1 origin gh-pages 2>/dev/null && git cat-file -e FETCH_HEAD:preview 2>/dev/null; then
            mkdir -p dist/preview && git archive FETCH_HEAD preview | tar -x -C dist
          fi
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

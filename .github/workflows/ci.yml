name: CI

# Static checks, then the self-test split into a matrix (one job per 5 short levels, one per long level from 14 on, plus the level-independent checks),
# each job well under 60 minutes, and the portal builds: zips, their checks, the Playgama QA Tool harness and the
# mocked-SDK tests. `npm test` still runs everything in one go locally.
on:
  push:
    branches-ignore: [gh-pages]
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:levels
      - run: npm run test:i18n
      - run: npm run build

  selftest:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        shard: ['--levels 1-5', '--levels 6-10', '--levels 11-13', '--levels 14-15', '--levels 16', '--levels 17', '--levels 18', '--levels 19', '--levels 20', '--general']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node tests/run-selftest.mjs ${{ matrix.shard }}
      - if: matrix.shard == '--general'
        run: node tests/hint-fit.mjs
      - if: matrix.shard == '--general'
        run: node tests/audio.mjs
      # death / respawn / no-soft-lock test of the shard's levels (tests/respawn.mjs)
      - if: matrix.shard != '--general'
        run: node tests/respawn.mjs ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-${{ strategy.job-index }}
          path: test-results/

  portals:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y zip unzip ffmpeg
      - run: npm run build
      - run: npm run release
      - run: npm run test:portals
      - run: npm run test:release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portals
          path: |
            test-results/
            release/*/*.zip

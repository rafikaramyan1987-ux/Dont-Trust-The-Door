name: CI

# Level validation, production build and the full headless self-test (bot completes every
# level from the start and from its checkpoint, every trap kills, every troll fires,
# layouts, touch, saving).
on:
  push:
    branches-ignore: [gh-pages]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-results
          path: test-results/

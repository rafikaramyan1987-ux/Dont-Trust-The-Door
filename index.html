<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2b2d42" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Don't Trust the Door</title>
    <style>
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: #2b2d42; overflow: hidden;
        overscroll-behavior: none; touch-action: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game { position: fixed; inset: 0; }
      #game canvas { display: block; touch-action: none; }
      #rotate {
        display: none; position: fixed; inset: 0; z-index: 10;
        background: #2b2d42; color: #fff6d5;
        font: 800 26px/1.3 "Trebuchet MS", "Arial Rounded MT Bold", system-ui, sans-serif;
        text-align: center; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        padding: 24px; box-sizing: border-box;
      }
      #rotate .phone {
        width: 70px; height: 120px; border: 6px solid #ffd23f; border-radius: 16px;
        animation: tilt 1.6s ease-in-out infinite;
      }
      #rotate small { font-weight: 600; font-size: 16px; opacity: .75; }
      @keyframes tilt { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate { display: flex; }
      }
      body.force-rotate #rotate { display: flex; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate" role="alert">
      <div class="phone"></div>
      <div data-t="rotate">Rotate your phone</div>
      <small data-t="rotateSub">Don't Trust the Door plays sideways.</small>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
